name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # We need a database and redis to run the tests and build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klyraen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/klyraen_test
      REDIS_URL: redis://localhost:6379
      # Provide dummy keys just so Next.js can build
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c3RyaWtpbmctbWFuYXRlZS02MS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_dummy

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma Client & Migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy
          
      - name: Run Tests
        run: npx vitest run
        
      - name: Build Next.js
        run: npm run build